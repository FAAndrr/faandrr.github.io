<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baseplate Playground</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #b8d9ef; color: #183344; }
    canvas { display: block; touch-action: none; }
    .panel { position: fixed; top: 20px; left: 20px; max-width: calc(100vw - 40px); padding: 18px 22px; background: #ffffffdf; border: 1px solid #ffffff; border-radius: 16px; box-shadow: 0 8px 30px #18334418; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 5px 0; font-size: 13px; line-height: 1.5; }
    label { display: inline-block; margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: #183344; color: white; font-size: 13px; cursor: pointer; }
    input { display: none; }
    #status { max-width: 300px; }
  </style>
  <script>
    window.addEventListener('error', function (event) {
      var status = document.getElementById('status');
      if (status) {
        status.textContent = 'The game could not start: ' +
          (event.message || 'a required script failed to load.');
      }
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="panel">
    <h1>First-person Playground</h1>
    <p>WASD / arrow keys — move · Space — jump</p>
    <p id="look-status">Click to look around · Drag also works</p>
    <p>Mouse — rotate camera · Esc — release cursor</p>
    <label for="texture">Choose baseplate PNG</label>
    <input id="texture" type="file" accept="image/png">
    <p id="status" role="status">Choose a PNG to texture the baseplate.</p>
  </div>
</body>
</html>
